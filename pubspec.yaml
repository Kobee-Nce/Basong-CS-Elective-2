name: flutter_application_1
description: "Game Credits Shop — Final Exam E-Commerce App (Flutter + Riverpod + Supabase)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.2.1
  google_fonts: ^6.2.1

  # State management
  flutter_riverpod: ^3.0.0

  # Backend: Auth, Postgres, Storage
  supabase_flutter: ^2.12.0

  # Product image picking (admin form)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
